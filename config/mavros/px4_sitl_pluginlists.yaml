# MAVROS plugin list for PX4 SITL (vision / mocap, no GPS).
# Blacklist guided_target: without /mavros/global_position/gp_origin it spams
# "PositionTargetGlobal failed because no origin" on every PX4 POSITION_TARGET_GLOBAL_INT.
plugin_blacklist:
- safety_area
- image_pub
- vibration
- distance_sensor
- rangefinder
- wheel_odometry
- guided_target

plugin_whitelist: []
